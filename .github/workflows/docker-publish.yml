name: Build and Publish Docker Images

# Manual publish is a workflow_dispatch of Test (on main). workflow_run does
# not receive that run's inputs, so there is no version input here. Images
# are tagged like a branch push: head_branch (main) and the short sha of the
# tested commit, plus latest when head_branch is the default branch.

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # pull_request completions are not listed, so they do not publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            startsWith(github.event.workflow_run.head_branch, 'v')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - target: neo4g
            image: ghcr.io/neo4g/neo4g
          - target: gateway
            image: ghcr.io/neo4g/gateway

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run's GITHUB_SHA is the default-branch tip. type=sha and the
      # image revision must use the commit Test actually ran.
      # Stable v* tags also get `latest` from metadata-action's default
      # flavor (latest=auto). Prerelease tags do not.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_branch }},priority=600,enable=${{ github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=sha
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
