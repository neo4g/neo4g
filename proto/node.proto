syntax = "proto3";

package neo4g.internal.v1;

option go_package = "github.com/seankohjs/neo4g/rpcpb";

// Node is the internal API between the gateway and database nodes,
// and between replicas and the primary. Clients keep using HTTP.
service Node {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc SetRole(SetRoleRequest) returns (SetRoleResponse);
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);
  rpc PullWAL(PullWALRequest) returns (PullWALResponse);
  rpc Checksum(ChecksumRequest) returns (ChecksumResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string node_id = 2;
  string role = 3;
  uint64 lsn = 4;
  string primary_addr = 5;
}

message SetRoleRequest {
  string role = 1;
  string primary_addr = 2;
}

message SetRoleResponse {
  string status = 1;
  string node_id = 2;
  string role = 3;
}

message ExecuteQueryRequest {
  string query = 1;
  bytes params_json = 2;
}

message ExecuteQueryResponse {
  int32 http_status = 1;
  bytes json_body = 2;
}

message PullWALRequest {
  uint64 from_lsn = 1;
}

message WALRecord {
  uint64 lsn = 1;
  uint64 tx_id = 2;
  uint32 type = 3;
  uint32 page_id = 4;
  bytes data = 5;
}

message PullWALResponse {
  repeated WALRecord records = 1;
}

message ChecksumRequest {}

message ChecksumResponse {
  string checksum = 1;
  uint32 page_count = 2;
  uint64 lsn = 3;
}
